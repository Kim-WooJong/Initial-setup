[package]
name = "cloudwins"
version = "0.15.0"
edition = "2021"
rust-version = "1.89"
description = "Safe source-authoritative one-way synchronization helper for Initial-setup"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2.5"
