name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  nushell:
    name: ${{ matrix.os }} / Nushell ${{ matrix.nu }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        nu:
          - "0.109.1"
          - "0.115.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: ${{ matrix.nu }}

      - name: Nushell version
        shell: nu {0}
        run: version

      - name: Validate project
        shell: nu {0}
        run: nu scripts/validate-project.nu

      - name: Validate dry-run setup
        shell: nu {0}
        run: nu setup.nu --dry-run --profile minimal --no-auto-sync

      - name: Validate Bash bootstrap
        if: runner.os != 'Windows'
        shell: bash
        run: bash -n bootstrap.sh

      - name: Validate PowerShell bootstrap
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path ./bootstrap.ps1),
              [ref]$null,
              [ref]$errors
          )
          if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
          }
